<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Service Consultation Request</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <p class="eyebrow">Service enquiry</p>
        <h1>Home Service Consultation Request</h1>
        <p>Tell us what is happening and a service coordinator will review your enquiry.</p>
      </section>
      <section class="card">
        <form id="enquiry-form" novalidate>
          <label>Full Name<input name="full_name" autocomplete="name" maxlength="160" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" /></label>
          <label>Phone<input name="phone" type="tel" autocomplete="tel" maxlength="50" /></label>
          <label>Message<textarea name="message" rows="6" maxlength="5000" required></textarea></label>
          <button type="submit">Submit Enquiry</button>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="card trace-card" aria-labelledby="trace-title">
        <div class="trace-heading">
          <div>
            <p class="eyebrow">Verification</p>
            <h2 id="trace-title">Trace a persisted enquiry</h2>
          </div>
          <p>Use the correlation ID returned after submission to inspect the development CRM adapter.</p>
        </div>
        <form id="trace-form" class="trace-form">
          <label>Correlation ID<input id="trace-id" name="correlation_id" autocomplete="off" required /></label>
          <button type="submit" class="secondary">View persisted lead</button>
        </form>
        <pre id="trace-result" aria-live="polite"></pre>
      </section>
    </main>
    <script src="/intake.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
